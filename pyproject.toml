[project]
name = "multicz"
version = "1.8.1"
description = "Multi-component versioning for monorepos: bump apps, charts, and images independently from conventional commits."
readme = "README.md"
authors = [
    { name = "Chris", email = "goabonga@pm.me" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["semver", "monorepo", "helm", "conventional-commits", "release", "versioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "tomlkit>=0.13",
    "ruamel-yaml>=0.18",
    "pathspec>=0.12",
    "packaging>=24.0",
]

[project.scripts]
multicz = "multicz.cli:app"

# Built-in plugins registered via the same entry-point group third-
# party plugins use. Disable a built-in by setting
# `[plugins.<name>] enabled = false` in multicz.toml - there is no
# privileged loader path.
[project.entry-points."multicz.plugins"]
deprecation = "multicz.plugins.builtin.deprecation:DeprecationPlugin"
upstream-notes = "multicz.plugins.builtin.upstream_notes:UpstreamNotesPlugin"

[project.urls]
Homepage = "https://github.com/goabonga/multicz"
Repository = "https://github.com/goabonga/multicz"
Issues = "https://github.com/goabonga/multicz/issues"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.0",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "zensical>=0.0.39",
]
# Branding-asset tooling, isolated from `dev` and `docs` so neither the
# quality pipeline nor the docs build drags a native cairo stack in.
# Only `scripts/regen-icons.sh` installs it, on demand, via
# `uv run --only-group favicon`.
favicon = [
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's recommended pattern is to call typer.Option() / typer.Argument()
# directly in argument defaults. B008 forbids that across the board, so we
# disable it for the entire CLI package (one file per command).
"src/multicz/cli/**.py" = ["B008"]
# The CI helper scripts build markdown and HTML summaries from long
# literals; the formatter already wraps everything it can.
"scripts/**.py" = ["E501"]
# Inline XML and TOML fixtures for the summary and dependabot scripts.
"tests/test_format_summary.py" = ["E501"]
"tests/test_rewrite_dependabot_commit.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
extra_checks = true
exclude = ["build/", "dist/", "site/", ".venv/"]

# pyright checks src as a second opinion next to mypy: the two checkers
# disagree on inference and narrowing.
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# multicz drives git through argument lists, never a shell, so the
# subprocess findings (B404, B603, B607) describe how the tool works.
# The asserts (B101) only narrow optional values for the type checkers.
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603", "B607"]
