# Dependabot v2 configuration.

version: 2

updates:
  # Python dependencies via uv.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      # Bundle routine dev/doc tooling bumps into a single weekly PR.
      dev-tools:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pyright"
          - "pre-commit"
          - "zensical"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
      - "python"

  # Pinned versions of GitHub Actions in `.github/workflows/*.yml`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "pypa/*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
