name: release

# Self-hosted release pipeline: multicz manages multicz.
#
# Runs after the `ci` workflow finishes green on main:
#   1. validate the multicz config (defense in depth)
#   2. plan the release (skip the rest if nothing pending)
#   3. bump pyproject.toml + CHANGELOG.md, commit, tag, push
#   4. build the wheel + sdist (uv build)
#   5. publish to PyPI via Trusted Publishing (OIDC, no token needed)
#   6. open a GitHub Release per new package tag, with notes from
#      `multicz release-notes`
#   7. rebuild and publish the documentation site to GitHub Pages
#
# Steps 4-6 are skipped on a docs-only release: the `docs` component has
# no wheel and no PyPI project, so `uv build` would rebuild the unchanged
# package version and PyPI would reject the duplicate upload.
#
# Setup: configure PyPI trusted publishing for the repo
# (https://docs.pypi.org/trusted-publishers/) - no PYPI_TOKEN secret
# required. If you prefer token-based publishing, swap the
# pypa/gh-action-pypi-publish step for `uv publish` with
# `UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}`.
#
# Optional GPG signing: define repository secrets `GPG_PRIVATE_KEY`
# (ASCII-armored, e.g. `gpg --armor --export-secret-keys`) and
# `GPG_PASSPHRASE` to sign the release commit and tag. When either
# secret is missing the pipeline still runs, just unsigned.

on:
  # Trigger only after the `ci` workflow finishes on `main`. The `if:`
  # below filters on success, so a red CI never produces a release.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write   # push the release commit and tags
  id-token: write   # OIDC claim for PyPI Trusted Publishing (and Pages)
  pages: write      # deploy the documentation site
  actions: write    # let the docs job purge stale Pages artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    # `pypi` matches the GitHub-side environment registered with the
    # PyPI Trusted Publisher. Without this, the OIDC token claim
    # `environment` is `MISSING` and PyPI returns `invalid-publisher`.
    environment:
      name: pypi
      url: https://pypi.org/p/multicz
    outputs:
      release: ${{ steps.plan.outputs.release }}
      bumped:  ${{ steps.plan.outputs.bumped }}
    # Only run when CI was green AND the trigger wasn't our own
    # `chore(release)` commit (which would loop forever).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run runs in the context of the default branch, but
          # we want the exact ref that just passed CI. `head_branch` is
          # always "main" given the trigger filter above.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Configure git
        # Attribute the release commit to whoever pushed the head commit
        # that triggered CI, so the chain "Bob pushed feat: X" ->
        # "Bob authored chore(release): bump X -> Y" is preserved on the
        # timeline. Falls back to the github-actions[bot] noreply
        # identity when the upstream payload doesn't carry an author.
        run: |
          NAME="${{ github.event.workflow_run.head_commit.author.name }}"
          EMAIL="${{ github.event.workflow_run.head_commit.author.email }}"
          git config user.name  "${NAME:-github-actions[bot]}"
          git config user.email "${EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        # Secrets can't be referenced from `if:` directly, so we
        # promote their presence to a step output.
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Pre-cache the passphrase in gpg-agent via a dummy sign so
          # subsequent `git commit -S` / `git tag -s` don't prompt.
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          # Tell git which key to sign with - derived from the imported
          # key so we don't need a separate KEY_ID secret.
          KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: Validate
        run: uv run multicz validate --strict

      - name: Plan
        id: plan
        run: |
          uv run multicz plan --summary "$GITHUB_STEP_SUMMARY" \
            --output json | tee /tmp/plan.json
          BUMPED=$(jq -r '.bumps | keys | join(" ")' /tmp/plan.json)
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMPED" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "package=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            # `docs` is a tracked component with no wheel and no PyPI
            # project, so it can be the only thing that moved. Build and
            # publish gate on the package specifically: otherwise a
            # docs-only release would rebuild the unchanged multicz
            # version and PyPI would reject the duplicate upload.
            if jq -e '.bumps | has("multicz")' /tmp/plan.json > /dev/null; then
              echo "package=true" >> "$GITHUB_OUTPUT"
            else
              echo "package=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        run: |
          uv run multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json \
            | tee /tmp/release.json

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        run: |
          uv run multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json \
            | tee /tmp/release.json

      - name: Reinstall (pick up the new version)
        if: steps.plan.outputs.package == 'true'
        run: uv sync --frozen

      - name: Build wheel and sdist
        if: steps.plan.outputs.package == 'true'
        run: uv build

      - name: Publish to PyPI (Trusted Publishing via OIDC)
        if: steps.plan.outputs.package == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        # Package tags only. `docs` declares no `github-release`
        # artifact - its release is the Pages deploy below - so a
        # `docs-v*` tag pointing at the same commit must not open an
        # entry on a Releases page people read for package changes.
        if: steps.plan.outputs.package == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD --list 'multicz-v*'); do
            uv run multicz release-notes --tag "$tag" \
              | gh release create "$tag" --title "$tag" --notes-file -
          done

  # Rebuild and publish the documentation site.
  #
  # Gated on the release job having RUN and succeeded, nothing finer.
  # Not on `outputs.release`: an output is the one term whose
  # server-side value cannot be inspected from outside a run, and a
  # sibling project lost a first deploy to exactly that gate evaluating
  # false with every visible input satisfied.
  #
  # Nothing is lost by leaving it out. The release job already refuses
  # to run on a red CI, off `main`, or on its own `chore(release)`
  # commit, and rebuilding the site is idempotent. The case this would
  # have excluded - release ran, planner bumped nothing - costs one
  # redundant redeploy of a site that should mirror `main` anyway.
  docs:
    needs: [release]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/docs.yml
    with:
      # `main`, not the triggering SHA: multicz has just pushed the
      # release commit and tags on top of it, and the published site
      # should be the released tree.
      ref: ${{ github.event.workflow_run.head_branch }}
      bumped: ${{ needs.release.outputs.bumped }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
