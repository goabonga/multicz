name: ci

on:
  pull_request:
  push:
    branches: [main]

# `concurrency` cancels superseded PR runs but never main-branch releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # An explicit shell enables pipefail, so `| tee` keeps the tool's status.
    shell: bash

jobs:
  # Verify the two-line SPDX header on the Python sources and the
  # workflows. The script needs no dependency, so nothing is synced.
  license-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check SPDX license headers
        run: |
          {
            python3 scripts/add_license_header.py --path src --types py --check
            python3 scripts/add_license_header.py --path tests --types py --check
            python3 scripts/add_license_header.py --path scripts --types py --check
            python3 scripts/add_license_header.py --path .github --types yml --check
          } 2>&1 | tee headers.txt

      - name: Summarize license headers
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py headers headers.txt

  # `ruff check` plus a separate `ruff format --check`, so formatting
  # drift is caught for contributors who skipped the pre-commit hooks.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=json --output-file=ruff.json src tests scripts

      - name: Summarize ruff check
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-check ruff.json

      - name: Format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src tests scripts 2>&1 | tee ruff-format.txt

      - name: Summarize ruff format
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py ruff-format ruff-format.txt

  # Static type checking of src with mypy.
  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type-check
        run: uv run mypy src 2>&1 | tee mypy.txt

      - name: Summarize mypy
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text mypy mypy.txt

  # Second type checker on src. mypy and pyright disagree on inference and
  # narrowing, so each catches what the other lets through.
  pyright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Type-check
        run: uv run --no-sync pyright --outputjson > pyright.json

      - name: Summarize pyright
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pyright pyright.json

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # multicz validate needs the full history for tag detection
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate multicz.toml
        run: uv run multicz validate --strict

  # Static security analysis of the source (Bandit); the skipped tests
  # are explained in `[tool.bandit]` of pyproject.toml.
  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Run Bandit
        run: uvx "bandit[toml]" -c pyproject.toml --recursive src --format json --output bandit.json

      - name: Summarize bandit
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py bandit bandit.json

  # Audit the locked dependency graph against the PyPI advisory database.
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Export locked requirements
        # `pip-audit --path .venv` finds no package in a uv venv and
        # audits nothing, so audit the pinned lock export instead.
        run: uv export --frozen --all-groups --no-emit-project --no-hashes --output-file requirements.txt

      - name: Run pip-audit
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --format json --output audit.json

      - name: Summarize pip-audit
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pip-audit audit.json

  # Multi-source vulnerability scan with OSV-Scanner, which reads uv.lock.
  # The binary is pinned to a release and verified against its published
  # checksum instead of downloading whatever `latest` points to.
  osv-scanner:
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: v2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OSV-Scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          echo "${OSV_SCANNER_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum --check
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run OSV-Scanner
        run: osv-scanner scan source --lockfile=uv.lock 2>&1 | tee osv-scanner.txt

      - name: Summarize osv-scanner
        if: ${{ !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/format_summary.py text osv-scanner osv-scanner.txt

  test:
    needs: [license-headers, lint, type-check, pyright, validate]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: |
          uv run pytest -q \
            --cov=multicz \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/format_summary.py pytest --junit junit.xml --coverage coverage.xml
