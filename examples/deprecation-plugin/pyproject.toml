[project]
name = "legacy-api"
version = "1.0.0"
description = "Example package that exercises the deprecation plugin."
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_api"]
