# multicz.toml - generated by `multicz init`
# https://github.com/goabonga/multicz

[project]
commit_convention = "conventional"
tag_format = "{component}-v{version}"
initial_version = "0.0.0"
# Opt in to the `uv lock` post_bump hook below. Without this, the
# default `deny` policy silently skips the hook and uv.lock drifts
# away from the just-written pyproject.toml version (catches CI on
# the next `uv sync --frozen`).
post_bump_policy = "allow"

[components.multicz]
paths = ["src/**", "pyproject.toml", "tests/**"]
bump_files = [
    {file = "pyproject.toml", key = "project.version"},
]
changelog = "CHANGELOG.md"
# Keep uv.lock in sync with pyproject.toml's new version, otherwise the
# next `uv sync --frozen` (CI) fails on lockfile drift.
post_bump = ["uv lock"]

[[components.multicz.artifacts]]
type = "pypi"
ref  = "multicz=={version}"

[[components.multicz.artifacts]]
type = "github-release"
ref  = "multicz-v{version}"

# `docs` is a release-tracked component for the Zensical site. It ships
# no artifact - the "release" is the GitHub Pages deploy - but giving
# the site a version and a tag is what lets multicz answer "did the
# docs move?" the same tag-aware way it answers it for the package,
# which is what the `docs` CI job gates on.
#
# `depends_on` the package so a code release also cascades a docs
# patch: the site documents the CLI and the config schema, so a feature
# release invalidates the rendered output even when no markdown file
# was touched in the same push.
#
# `bump_rules` here MERGES into `[project.bump_rules]`, adding `docs`
# on top of the inherited feat/fix/perf/revert. A `docs:` commit
# therefore bumps this component and nothing else - the package
# inherits the project rules, where `docs` is absent.
[components.docs]
paths = ["docs/**", "zensical.toml"]
bump_files = [
    {file = "zensical.toml", key = "project.extra.versions.docs"},
]
depends_on = ["multicz"]
bump_rules = { docs = "patch" }
